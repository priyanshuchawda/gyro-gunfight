; ESP32 DevKit — wireless aim controller (BLE UART).
; Same AIM line protocol as the wired NodeMCU firmware.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
	-DCORE_DEBUG_LEVEL=0
