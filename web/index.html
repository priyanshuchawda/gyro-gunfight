<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gyro Gunfight — Range</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a24;
    --line: #232c3b;
    --text: #e6ecf5;
    --muted: #8996ab;
    --accent: #ff5c39;
    --good: #3ddc84;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  h1 {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0;
    font-weight: 600;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #5b6373;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
  }

  .dot.live { background: var(--good); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 16px;
    padding: 16px 20px 20px;
  }

  #stage {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #1b2536 0%, #0c1119 70%);
  }

  canvas { display: block; width: 100%; height: 100%; }

  aside {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }

  .card h2 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .row {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    padding: 2px 0;
  }

  .row span:last-child { color: var(--muted); }

  .big {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 4px;
  }

  input[type="range"] { width: 100%; accent-color: var(--accent); }

  button {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #1d2634;
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover { border-color: var(--accent); }

  .hint {
    color: var(--muted);
    font-size: 12px;
  }

  kbd {
    background: #1d2634;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
  }
</style>
</head>
<body>
  <header>
    <h1>Gyro Gunfight — Range</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="link">waiting for bridge</span>
    </div>
    <div class="status" id="rate">0 Hz</div>
  </header>

  <main>
    <div id="stage"><canvas id="range"></canvas></div>

    <aside>
      <div class="card">
        <h2>Score</h2>
        <div class="big" id="score">0</div>
        <div class="row"><span>Hits</span><span id="hits">0</span></div>
        <div class="row"><span>Shots</span><span id="shots">0</span></div>
        <div class="row"><span>Accuracy</span><span id="acc">—</span></div>
        <div class="row"><span>Best streak</span><span id="streak">0</span></div>
      </div>

      <div class="card">
        <h2>Controller</h2>
        <div class="row"><span>Pitch</span><span id="pitch">0.0°</span></div>
        <div class="row"><span>Yaw</span><span id="yaw">0.0°</span></div>
        <div class="row"><span>Roll</span><span id="roll">0.0°</span></div>
        <div class="row"><span>Trigger</span><span id="trig">up</span></div>
      </div>

      <div class="card">
        <h2>Feel</h2>
        <label for="sens">Sensitivity <span id="sensval">18</span>°/screen</label>
        <input type="range" id="sens" min="6" max="45" value="18" />
        <label for="smooth" style="margin-top:10px">Smoothing <span id="smoothval">0.35</span></label>
        <input type="range" id="smooth" min="0" max="90" value="35" />
      </div>

      <div class="card">
        <h2>Controls</h2>
        <button id="center">Re-centre aim</button>
        <p class="hint" style="margin:10px 0 0">
          <kbd>R</kbd> re-centre · <kbd>Space</kbd> or click to shoot ·
          hardware trigger on <kbd>D5</kbd> also fires.
        </p>
      </div>
    </aside>
  </main>

  <script src="range.js"></script>
</body>
</html>
